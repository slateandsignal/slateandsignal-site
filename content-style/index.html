<style>
  :root{
    --black:#0D0D0D;
    --white:#FFFFFF;
    --gold:#FFDE7A;
    --gold-deep:#C9A227;
    --muted:#6B6B6B;
    --rule:#E6E6E6;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'DM Sans', -apple-system, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--white);color:var(--black);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  .page{max-width:640px;margin:0 auto;padding:48px 28px 96px;}

  /* masthead, same bones as the invoice */
  .mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:22px;border-bottom:1.5px solid var(--black);margin-bottom:44px;}
  .brand{font-family:var(--serif);font-size:30px;font-weight:400;line-height:1;text-decoration:none;}
  .brand-tag{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-top:8px;}
  .mast-right{text-align:right;font-size:13px;color:var(--muted);line-height:1.5;}
  .mast-right strong{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--black);letter-spacing:.04em;}

  .label{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:14px;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,8vw,58px);line-height:1.04;margin-bottom:18px;}
  h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5.4vw,34px);line-height:1.2;margin-bottom:28px;}
  h3{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.25;margin-bottom:8px;}
  p{font-size:16px;margin-bottom:16px;color:#2A2A2A;}
  .dek{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;color:#333;margin-bottom:34px;}
  .small{font-size:13px;color:var(--muted);}

  .steps{list-style:none;border-top:1px solid var(--black);margin:28px 0 36px;}
  .steps li{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:15px;}
  .steps li span{font-family:var(--serif);font-size:18px;color:var(--gold-deep);min-width:18px;}

  /* form */
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:8px;}
  .field input{width:100%;border:0;border-bottom:1px solid var(--black);padding:10px 0;font:inherit;font-size:18px;background:transparent;border-radius:0;}
  .field input:focus{outline:none;border-bottom:2px solid var(--gold-deep);}
  .err{color:#9B2C2C;font-size:13px;margin-top:-8px;margin-bottom:16px;}

  .btn{display:inline-block;background:var(--black);color:var(--white);padding:17px 38px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;text-decoration:none;transition:background .2s;}
  .btn:hover{background:var(--gold);color:var(--black);}
  .btn-line{background:transparent;color:var(--black);border:1px solid var(--black);}
  .btn-line:hover{background:var(--black);color:var(--white);}
  .btn-block{display:block;width:100%;text-align:center;}

  /* question screens */
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .q-meta .label{margin:0;}
  .back{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
  .back:hover{color:var(--black);}
  .back[hidden]{display:none;}
  .answers{border-top:1px solid var(--black);}
  .answer{display:flex;gap:18px;width:100%;text-align:left;padding:19px 4px;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.5;transition:background .15s;}
  .answer:hover{background:#FAFAF7;}
  .answer .k{font-family:var(--serif);font-size:19px;color:var(--gold-deep);min-width:20px;line-height:1.3;}
  .answer .t strong{display:block;font-weight:500;font-size:16px;margin-bottom:2px;color:var(--black);}
  .answer .t em{font-style:normal;font-size:14px;color:var(--muted);}
  .answer.picked{background:#FFF8E1;}
  .part-intro{font-size:15px;color:var(--muted);margin:-14px 0 26px;}

  .screen{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* result, laid out like the invoice */
  .r-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px;}
  .r-head .col{min-width:0;}
  .r-head .right{text-align:right;margin-left:auto;}
  .r-style{font-family:var(--serif);font-size:clamp(40px,9vw,60px);line-height:1;margin-bottom:10px;}
  .r-style em{font-style:normal;color:var(--gold-deep);}
  .lines{border-top:1px solid var(--black);margin-bottom:40px;}
  .line{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--rule);}
  .line .l{font-size:15px;}
  .line .l small{display:block;font-style:italic;color:var(--muted);font-size:13px;}
  .line .v{text-align:right;font-size:15px;}
  .section{margin-bottom:44px;}
  .section p{font-size:16px;}
  .fmt{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px;}
  .fmt .why{color:var(--muted);font-size:13px;text-align:right;}
  .fmt.out{color:#9A9A9A;}
  .fmt.out .name{text-decoration:line-through;text-decoration-color:#C8C8C8;}
  .note{border:1px solid var(--gold-deep);padding:26px 28px;margin-bottom:44px;}
  .note p:last-child{margin-bottom:0;}
  .recog{columns:2;column-gap:28px;margin:14px 0 16px;list-style:none;}
  .recog li{font-size:15px;padding:4px 0;break-inside:avoid;}
  .cta{border-top:1.5px solid var(--black);padding-top:34px;margin-top:10px;}
  .price{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--black);padding:18px 0 26px;margin-top:22px;}
  .price .n{font-family:var(--serif);font-size:26px;}
  .price .a{font-family:var(--serif);font-size:30px;color:var(--gold-deep);}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;}
  .foot{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:64px;}

  @media (max-width:520px){
    .page{padding:32px 22px 80px;}
    .mast-right{display:none;}
    .recog{columns:1;}
    .fmt{flex-direction:column;gap:2px;}
    .fmt .why{text-align:left;}
  }
  @media print{
    .no-print{display:none!important;}
    .page{padding:0;max-width:none;}
    .screen{animation:none;}
    .section,.note,.cta{break-inside:avoid;}
  }
</style>

  ["Let people watch it develop.","Drafts, sketches, rehearsals, research, edits, materials, rejected versions, experiments, and progress can become part of the experience of the finished work."],
  ["Show what participation actually looks like.","Gatherings, projects, conversations, collaborations, preparation, member activity, and progress help people see the community in action."],
  ["Let people see parts of the company being built.","Development, decisions, launches, experiments, customer feedback, operations, milestones, and changes can make the work itself worth following."],
  ["Pick something already happening in your life and document it for a while.","You may discover the subject by paying attention to what you enjoy showing and what other people want to keep following."]]
};

var COMBOS = {
 "EX+ST":"Explain through experiences and examples.",
 "EX+DO":"Show the process, then make sense of what is happening.",
 "ST+CM":"Tell what happened and add what you think it means.",
 "SH+CM":"Recommend things, but give people enough judgment to understand why you chose them.",
 "SH+CO":"Find interesting things and bring other people into the discovery.",
 "CO+CM":"Use questions, reactions, and discussion to develop a point of view.",
 "DO+ST":"Capture what happens, then shape the strongest moments into a story."
};
var ORDER = ["EX","ST","SH","CO","CM","DO"];

/* ---------- state ---------- */
var S = {step:"intro", i:0, name:"", email:"", a:[], build:null, vis:null, prod:null};
function save(){ try{ localStorage.setItem("ss-content-style", JSON.stringify(S)); }catch(e){} }
function load(){ try{ var v = JSON.parse(localStorage.getItem("ss-content-style")); if(v && v.email) S = v; }catch(e){} }

function send(payload){
  if(!WEBHOOK) return;
  try{
    var body = new URLSearchParams(payload);
    fetch(WEBHOOK, {method:"POST", mode:"no-cors", body:body});
  }catch(e){}
}

var app = document.getElementById("app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(html){ app.innerHTML = '<div class="screen">'+html+'</div>'; window.scrollTo(0,0); }

/* ---------- screens ---------- */
function intro(){
  render(
    '<div class="label">A self-scoring guide</div>'+
    '<h1>Find Your Content Style</h1>'+
    '<p class="dek">The way you naturally communicate, the content formats that may fit you best, and how to use them for what you’re building.</p>'+
    '<p>There are plenty of ways to create content. You do not need to be good at all of them.</p>'+
    '<ol class="steps">'+
      '<li><span>1</span>How you naturally communicate</li>'+
      '<li><span>2</span>Which content formats fit that style</li>'+
      '<li><span>3</span>What you want your content to help you build</li>'+
      '<li><span>4</span>How visible and involved you actually want to be</li>'+
    '</ol>'+
    '<p class="small" style="margin-bottom:30px">Fifteen taps. Your result is scored for you and sent to your inbox so you can come back to it.</p>'+
    '<form id="gate" novalidate>'+
      '<div class="field"><label for="fn">First name</label><input id="fn" autocomplete="given-name" value="'+esc(S.name)+'"></div>'+
      '<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email" value="'+esc(S.email)+'"></div>'+
      '<div class="err" id="err" hidden></div>'+
      '<button class="btn btn-block" type="submit">Begin</button>'+
    '</form>'
  );
  document.getElementById("gate").onsubmit = function(e){
    e.preventDefault();
    var n = document.getElementById("fn").value.trim();
    var m = document.getElementById("em").value.trim();
    var err = document.getElementById("err");
    if(!n){ err.textContent = "Add your first name so your result is addressed to you."; err.hidden = false; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){ err.textContent = "That email doesn’t look complete yet."; err.hidden = false; return; }
    S.name = n; S.email = m; S.step = "how"; save();
    send({stage:"start", first_name:n, email:m});
    how();
  };
}

function how(){
  render(
    '<div class="label">How this works</div>'+
    '<h2>Choose the answer that is closest to what you would <em>actually</em> do.</h2>'+
    '<p>Do not choose what sounds smartest, most useful, or most likely to perform online.</p>'+
    '<p style="margin-bottom:36px">If two answers could fit, choose the one you would probably do first.</p>'+
    '<button class="btn btn-block" id="go">Start the questions</button>'
  );
  document.getElementById("go").onclick = function(){ S.step="q"; S.i=0; save(); question(); };
}

function question(){
  var q = Q[S.i], letters = ["A","B","C","D"], rows = "";
  for(var k=0;k<4;k++){
    rows += '<button class="answer'+(S.a[S.i]===k?' picked':'')+'" data-k="'+k+'"><span class="k">'+letters[k]+'</span><span class="t">'+esc(q[1][k])+'</span></button>';
  }
  render(
    '<div class="q-meta"><div class="label">Part one &middot; Question '+(S.i+1)+' of 12</div><button class="back" id="back">Back</button></div>'+
    '<h2>'+esc(q[0])+'</h2>'+
    '<div class="answers">'+rows+'</div>'
  );
  document.getElementById("back").onclick = function(){
    if(S.i===0){ S.step="how"; save(); how(); } else { S.i--; save(); question(); }
  };
  [].forEach.call(app.querySelectorAll(".answer"), function(b){
    b.onclick = function(){
      S.a[S.i] = +b.dataset.k; b.classList.add("picked");
      setTimeout(function(){
        if(S.i<11){ S.i++; save(); question(); } else { S.step="build"; save(); choice("build"); }
      }, 180);
    };
  });
}

var PARTS = {
  build:{label:"Part two", title:"What are you building toward?", intro:"Your Content Style tells you how you naturally communicate. Now decide what you want your content to help you build right now.", list:BUILD, prev:"q", next:"vis"},
  vis:{label:"Part three", title:"How visible do you want to be?", intro:"There is no rule that says a personal brand requires turning your private life into content. But people usually need some way to recognize the person, thinking, taste, work, or point of view behind what they are following.", list:VIS, prev:"build", next:"prod"},
  prod:{label:"Part four", title:"What can you realistically keep making?", intro:"The best content format is not useful if you hate making it.", list:PROD, prev:"vis", next:"result"}
};
function choice(key){
  var P = PARTS[key], rows = "", letters = "ABCDEFG";
  P.list.forEach(function(o,k){
    rows += '<button class="answer'+(S[key]===k?' picked':'')+'" data-k="'+k+'"><span class="k">'+letters[k]+'</span><span class="t"><strong>'+esc(o[0])+'</strong><em>'+esc(o[1])+'</em></span></button>';
  });
  render(
    '<div class="q-meta"><div class="label">'+P.label+'</div><button class="back" id="back">Back</button></div>'+
    '<h2>'+P.title+'</h2>'+
    '<p class="part-intro">'+P.intro+' Choose the closest.</p>'+
    '<div class="answers">'+rows+'</div>'
  );
  document.getElementById("back").onclick = function(){
    if(P.prev==="q"){ S.step="q"; S.i=11; save(); question(); } else { S.step=P.prev; save(); choice(P.prev); }
  };
  [].forEach.call(app.querySelectorAll(".answer"), function(b){
    b.onclick = function(){
      S[key] = +b.dataset.k; b.classList.add("picked");
      setTimeout(function(){
        S.step = P.next; save();
        if(P.next==="result"){ result(true); } else { choice(P.next); }
      }, 180);
    };
  });
}

/* ---------- scoring ---------- */
function score(){
  var t = {EX:0,ST:0,SH:0,CO:0,CM:0,DO:0};
  S.a.forEach(function(k,i){ t[Q[i][2][k]]++; });
  var ranked = ORDER.slice().sort(function(x,y){ return t[y]-t[x] || ORDER.indexOf(x)-ORDER.indexOf(y); });
  var top = [ranked[0]];
  if(t[ranked[0]] - t[ranked[1]] <= 1) top.push(ranked[1]);
  return {totals:t, top:top};
}
function comboLine(top){
  if(top.length<2) return null;
  return COMBOS[top[0]+"+"+top[1]] || COMBOS[top[1]+"+"+top[0]] || "Look at the formats for both. The combination may actually be more useful than either one alone.";
}

/* ---------- format filtering ---------- */
function filterFormats(top){
  var seen = {}, all = [];
  top.forEach(function(c){ STYLES[c].formats.forEach(function(f){ if(!seen[f[0]]){ seen[f[0]]=1; all.push(f); } }); });
  function visReason(f){
    var face=f[1], voice=f[2], flags=f[4]||"";
    if(S.vis>=2 && face===2) return "needs your face on camera";
    if(S.vis>=4 && voice) return "needs your voice";
    if(S.vis===5 && flags.indexOf("personal")>-1) return "shares your private life";
    return null;
  }
  function prodReason(f){
    var p=f[3], flags=f[4]||"";
    if((S.prod===0||S.prod===1) && p===3) return "heavier production";
    if(S.prod===2 && p===3 && flags.indexOf("doc")<0) return "heavier production";
    if(S.prod===4 && p>=2) return "more production than you want";
    return null;
  }
  function run(useProd){
    var keep=[], out=[];
    all.forEach(function(f){
      var r = visReason(f) || (useProd ? prodReason(f) : null);
      if(r) out.push([f[0],r]); else keep.push(f);
    });
    return {keep:keep, out:out};
  }
  var r = run(true);
  if(r.keep.length < 3) r = run(false);
  var flag = S.prod===1 ? "write" : S.prod===2 ? "doc" : null;
  r.keep.sort(function(a,b){
    if(flag){ var fa=(a[4]||"").indexOf(flag)>-1, fb=(b[4]||"").indexOf(flag)>-1; if(fa!==fb) return fa?-1:1; }
    if(S.prod===3) return b[3]-a[3];
    return a[3]-b[3];
  });
  return r;
}

/* ---------- result ---------- */
function result(fresh){
  var sc = score(), top = sc.top, t = sc.totals;
  var styleName = top.length>1
    ? STYLES[top[0]].short+' <em>+</em> '+STYLES[top[1]].short
    : STYLES[top[0]].name;
  var plainStyle = top.map(function(c){ return STYLES[c].short; }).join(" + ");
  var f = filterFormats(top);

  var html =
    '<div class="r-head">'+
      '<div class="col"><div class="label">Prepared for</div><p style="margin:0;font-size:17px">'+esc(S.name)+'</p></div>'+
      '<div class="col right"><div class="label">Your result</div><p class="small" style="margin:0">'+new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+'</p></div>'+
    '</div>'+
    '<div class="label">Your content style</div>'+
    '<div class="r-style">'+styleName+'</div>';

  if(top.length>1) html += '<p class="dek" style="margin-bottom:30px">'+esc(comboLine(top))+'</p>';
  else html += '<div style="height:24px"></div>';

  html += '<div class="lines">'+
    '<div class="line"><div class="l">Building toward</div><div class="v">'+BUILD_SHORT[S.build]+'</div></div>'+
    '<div class="line"><div class="l">Visibility</div><div class="v">'+VIS_SHORT[S.vis]+'</div></div>'+
    '<div class="line"><div class="l">Production</div><div class="v">'+PROD_SHORT[S.prod]+'</div></div>'+
    '<div class="line"><div class="l">Your scores<small>Highest score is your strongest style. Within one point, keep both.</small></div><div class="v">'+
      ORDER.map(function(c){ return c+' '+t[c]; }).join(' &middot; ')+'</div></div>'+
  '</div>';

  top.forEach(function(c){
    html += '<div class="section"><div class="label">'+STYLES[c].name+'</div>'+
      STYLES[c].desc.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+'</div>';
  });

  top.forEach(function(c){
    var d = DIR[c][S.build];
    html += '<div class="section"><div class="label">Your direction &middot; '+STYLES[c].short+' + '+BUILD_SHORT[S.build]+'</div>'+
      '<h3>'+esc(d[0])+'</h3>'+
      d[1].split("|").map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+'</div>';
  });

  html += '<div class="section"><div class="label">Formats to try</div>'+
    '<p class="small">Filtered for how visible you want to be and what you can realistically keep making. You do not need to use all of them.</p>'+
    '<div style="border-top:1px solid var(--black)">'+
      f.keep.map(function(x){ return '<div class="fmt"><span class="name">'+esc(x[0])+'</span></div>'; }).join('')+
    '</div></div>';

  if(f.out.length){
    html += '<div class="section"><div class="label">Set aside for now</div>'+
      '<div style="border-top:1px solid var(--rule)">'+
        f.out.map(function(x){ return '<div class="fmt out"><span class="name">'+esc(x[0])+'</span><span class="why">'+x[1]+'</span></div>'; }).join('')+
      '</div>'+
      '<p class="small" style="margin-top:14px">Your result is not telling you what you must do. It is narrowing the field of possibilities.</p></div>';
  }

  if(S.vis>=2){
    html += '<div class="note"><div class="label">Faceless does not have to mean anonymous</div>'+
      '<p>There is a difference between “I do not want my private life to become content” and “I do not want anyone to know there is a person behind this.”</p>'+
      '<p style="margin-bottom:6px">A recognizable personal brand can come from more than a face. People can begin to recognize:</p>'+
      '<ul class="recog"><li>Your voice</li><li>Your taste</li><li>Your way of explaining something</li><li>What you notice</li><li>What you choose to show</li><li>The subjects you return to</li><li>Your visual style</li><li>Your work</li><li>Your point of view</li></ul>'+
      '<p>You decide how much access people get.</p></div>';
  }

  html += '<div class="section"><div class="label">What this does not decide</div>'+
    '<p>This assessment can help you identify the way you naturally communicate and narrow the kinds of content you may want to try.</p>'+
    '<p>It does not determine your niche. It does not tell you what makes your particular combination of experience, interests, strengths, and ideas valuable. It does not research your market, competition, opportunities, or positioning.</p>'+
    '<p>Those are different questions.</p></div>';

  html += '<div class="cta"><div class="label">If you know how you want to create, but not what your brand should be</div>'+
    '<p>The <strong style="font-weight:500">Signal Profile</strong> looks at you individually.</p>'+
    '<p>Your answers are analyzed to identify the patterns in your experience, strengths, interests, and direction and turn them into a clearer starting point for your personal brand.</p>'+
    '<p>It includes possible niche directions, subjects you could build around, content starting points, platform fit, color direction, and the patterns that already make your brand yours.</p>'+
    '<div class="price"><span class="n">Signal Profile</span><span class="a">$59</span></div>'+
    '<a class="btn btn-block" href="'+PROFILE_URL+'">See the Signal Profile</a></div>';

  html += '<div class="actions no-print">'+
    '<button class="btn btn-line" id="pdf">Save as PDF</button>'+
    '<button class="btn btn-line" id="redo">Retake</button>'+
  '</div>'+
  '<p class="small no-print" style="margin-top:16px">A copy of this result is on its way to '+esc(S.email)+'.</p>';

  render(html);
  document.getElementById("mastRight").innerHTML = '<strong>'+plainStyle+'</strong>'+BUILD_SHORT[S.build];
  document.getElementById("pdf").onclick = function(){ window.print(); };
  document.getElementById("redo").onclick = function(){
    S = {step:"how", i:0, name:S.name, email:S.email, a:[], build:null, vis:null, prod:null}; save(); how();
  };

  if(fresh){
    send({
      stage:"complete", first_name:S.name, email:S.email,
      content_style: top[0], content_style_second: top[1]||"",
      content_style_label: plainStyle,
      building_toward: BUILD_SHORT[S.build], visibility: VIS_SHORT[S.vis], production: PROD_SHORT[S.prod],
      style_description: top.map(function(c){ return STYLES[c].desc.join(" "); }).join(" "),
      direction_title: top.map(function(c){ return DIR[c][S.build][0]; }).join(" / "),
      direction_body: (top.length>1 ? comboLine(top)+" " : "") + top.map(function(c){ return DIR[c][S.build][1].replace("|"," "); }).join(" "),
      formats: f.keep.map(function(x){ return x[0]; }).join(", "),
      scores: ORDER.map(function(c){ return c+":"+t[c]; }).join(" ")
    });
  }
}

/* ---------- boot ---------- */
load();
if(S.step==="result" && S.prod!==null) result(false);
else if(S.step==="q" && S.email) question();
else if(PARTS[S.step] && S.email) choice(S.step);
else if(S.step==="how" && S.email) how();
else intro();
</script>
</body>
</html>
