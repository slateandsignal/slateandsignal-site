<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Command Center">
<title>Katie Bradley | Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--white:#FFFFFF;--aqua:#7DD4E8;--tan:#E8967A;--muted:#3B8FA8;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--ink);font-family:'DM Sans',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate{width:100%;max-width:380px;border-top:4px solid var(--tan);padding-top:28px}
.brand{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.2rem;line-height:1.05;margin-bottom:22px}
label{display:block;font-size:.8rem;font-weight:500;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.85rem}
button{width:100%;font:inherit;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;padding:14px;background:var(--ink);color:var(--aqua);border:none;border-radius:0;cursor:pointer}
button:disabled{background:var(--muted);color:var(--white)}
#msg{min-height:1.4em;margin-top:12px;font-size:.85rem;color:#B3261E}
</style></head>
<body>
<form class="gate" id="gate" autocomplete="on">
  <div class="brand">Slate &amp; Signal</div>
  <h1>Katie Bradley<br>Command Center</h1>
  <input type="text" name="username" value="katie" autocomplete="username" style="display:none" aria-hidden="true">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <div class="row"><input id="remember" type="checkbox" checked><label for="remember" style="margin:0;font-weight:400">Remember on this device</label></div>
  <button id="go" type="submit">Open</button>
  <div id="msg" role="alert"></div>
</form>

const KEY='ss-katie-cc-pw';
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlockWith(Q,pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(Q.s),iterations:Q.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(Q.i)},key,d(Q.c));
  return new TextDecoder().decode(pt);
}
// Opens with the client's one Slate & Signal passcode, or the original Command Center password.
async function unlock(pw){ try{ return await unlockWith(P2,pw); }catch(e){ return await unlockWith(P,pw); } }
function show(html){document.open();document.write(html);document.close();}
const form=document.getElementById('gate'),btn=document.getElementById('go'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;btn.textContent='Opening…';msg.textContent='';
  const pw=document.getElementById('pw').value.trim().toLowerCase();
  try{
    const html=await unlock(pw);
    try{ if(document.getElementById('remember').checked) localStorage.setItem(KEY,pw); else localStorage.removeItem(KEY);}catch(_){}
    show(html);
  }catch(err){
    msg.textContent='That password didn\'t work. Check it and try again.';
    btn.disabled=false;btn.textContent='Open';
  }
});
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY);}catch(_){}
  if(saved){btn.disabled=true;btn.textContent='Opening…';
    try{show(await unlock(saved));}catch(_){try{localStorage.removeItem(KEY);}catch(__){} btn.disabled=false;btn.textContent='Open';}}
})();
</script>
