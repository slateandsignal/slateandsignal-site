<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Slate &amp; Signal</title>
<meta name="description" content="Short, direct notes on personal brand strategy, drawn from real research and real reports.">
<link rel="canonical" href="https://slateandsignal.studio/blog/">
<meta property="og:type" content="website">
<meta property="og:title" content="Blog | Slate & Signal">
<meta property="og:description" content="Short, direct notes on personal brand strategy, drawn from real research and real reports.">
<meta property="og:url" content="https://slateandsignal.studio/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0D0D0D;
    --white:#FFFFFF;
    --gold:#FFDE7A;
    --gold-deep:#C9A227;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'DM Sans', -apple-system, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--white);color:var(--black);font-family:var(--sans);font-weight:300;line-height:1.8;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 32px;}
  .label{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;}

  nav{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--white);border-bottom:1px solid rgba(13,13,13,.08);}
  .nav-inner{display:flex;justify-content:space-between;align-items:center;height:80px;}
  .nav-logo img{height:56px;width:auto;}
  .nav-links{display:flex;gap:38px;align-items:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;}
  .nav-links a:hover{color:var(--gold-deep);}
  .nav-btn{border:1px solid var(--black);padding:10px 24px;}
  .nav-btn:hover{background:var(--black);color:var(--white);}
  .nav-toggle{display:none;}
  .nav-toggle-label{display:none;cursor:pointer;font-size:24px;line-height:1;padding:8px;}

  .page-head{padding:150px 0 60px;}
  .page-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(38px,5vw,60px);margin-top:16px;}

  .post-grid{padding-bottom:140px;display:grid;gap:2px;background:rgba(13,13,13,.08);}
  .post-card{background:var(--white);display:grid;grid-template-columns:280px 1fr;gap:40px;padding:36px 0;align-items:center;}
  .post-card .thumb{height:180px;background-size:cover;background-position:center 20%;}
  .post-card .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:12px;}
  .post-card h2{font-family:var(--serif);font-weight:500;font-size:28px;margin-bottom:12px;}
  .post-card p{font-size:15.5px;color:rgba(13,13,13,.75);max-width:520px;}
  .post-card .read-more{display:inline-block;margin-top:16px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-deep);}

  footer{background:var(--black);color:rgba(255,255,255,.65);padding:70px 0;font-size:12px;letter-spacing:.12em;}
  .foot-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:26px;}
  .foot-logo img{height:72px;width:auto;}

  @media(max-width:760px){
        .nav-inner{position:relative;}
    .nav-links{position:fixed;top:80px;left:0;right:0;background:var(--white);flex-direction:column;align-items:stretch;gap:0;max-height:0;overflow:hidden;transition:max-height .3s ease;border-bottom:1px solid rgba(13,13,13,.08);}
    .nav-links a{padding:18px 32px;border-top:1px solid rgba(13,13,13,.06);}
    .nav-links a:not(.nav-btn){display:block;}
    .nav-links .nav-btn{margin:16px 32px;text-align:center;border-top:none;}
    .nav-toggle-label{display:block;}
    .nav-toggle:checked ~ .nav-links{max-height:500px;}
    .post-card{grid-template-columns:1fr;gap:20px;}
  }
</style>
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <a class="nav-logo" href="/" aria-label="Slate and Signal home"><img src="../images/logo-dark.png" alt="Slate &amp; Signal"></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    <div class="nav-links">
      <a href="/#profile">Signal Profile</a>
      <a href="/#report">Signal Report</a>
      <a href="/#method">The Method</a>
      <a href="/blog/">Blog</a>
      <a class="nav-btn" href="/#begin">Begin</a>
    </div>
  </div>
</nav>

<div class="page-head wrap">
  <div class="label">The Blog</div>
  <h1>Notes on building with clarity.</h1>
</div>

<div class="wrap">
  <div class="post-grid">
    <a class="post-card" href="/blog/the-personal-branding-problem.html">
      <div class="thumb" style="background-image:url('../images/blog/problem-with-persibal-branding.png')"></div>
      <div>
        <div class="eyebrow">Foundation 001</div>
        <h2>The Personal Branding Problem</h2>
        <p>Why building a personal brand feels so confusing, and where the real starting point actually is.</p>
        <span class="read-more">Read the post &rarr;</span>
      </div>
    </a>
  </div>
</div>

<footer>
  <div class="wrap foot-inner">
    <a class="foot-logo" href="/"><img src="../images/logo-white.png" alt="Slate &amp; Signal"></a>
    <div>slateandsignal.studio</div>
  </div>
</footer>

</body>
</html>
